[project]
name = "playerworth"
version = "0.1.0"
description = "Football market-value analytics and historical data preparation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas==2.3.3", "numpy==2.3.3", "scikit-learn==1.7.2",
    "joblib==1.5.2", "scipy==1.16.2", "xgboost==3.4.1",
    "SQLAlchemy==2.0.54", "alembic==1.20.0", "psycopg[binary]==3.3.6",
    "fastapi==0.142.2", "pydantic==2.13.5", "uvicorn==0.54.0",
]

# The Transfermarkt adapter uses Pandas; generic utilities remain standard-library only.
[tool.pytest.ini_options]
testpaths = ["backend/tests", "ml/tests", "tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
